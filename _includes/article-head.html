<meta name="citation_title" content="{{ page.title | escape }}">
{% for a in page.authors %}<meta name="citation_author" content="{{ a.name | escape }}">
{% if a.affiliation %}<meta name="citation_author_institution" content="{{ a.affiliation | escape }}">{% endif %}{% endfor %}
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_journal_title" content="{{ site.title }}">
<meta name="citation_journal_abbrev" content="{{ site.short_title }}">
{% if site.issn != "" %}<meta name="citation_issn" content="{{ site.issn }}">{% endif %}
<meta name="citation_volume" content="{{ page.volume }}"><meta name="citation_issue" content="{{ page.issue }}">
{% if page.doi %}<meta name="citation_doi" content="{{ page.doi }}">{% endif %}
{% if page.pdf %}<meta name="citation_pdf_url" content="{{ page.pdf | absolute_url }}">{% endif %}
{% for k in page.keywords %}<meta name="citation_keywords" content="{{ k | escape }}">{% endfor %}
<meta name="citation_abstract_html_url" content="{{ page.url | absolute_url }}">
